<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sowa Pojazdy</title>
<meta name="theme-color" content="#1d1a4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen night-sky app — owl + speech bubble on top, camera "window" in the middle, big round controls at the bottom */
:root{
  --sky:#1d1a4a; --sky-2:#2b2766; --moon:#ffd35c; --leaf:#5fd39a; --berry:#ff6b8a; --ink:#fff8e6; --dim:#b9b3e8;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,var(--sky-2),var(--sky) 70%);color:var(--ink);font-family:var(--body);
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  max-width:720px;margin:0 auto}
.stars-bg{position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:
  radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 12%,#fff 50%,transparent 51%),
  radial-gradient(2px 2px at 88% 40%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 30% 8%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 60% 28%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 6% 55%,#fff 50%,transparent 51%)}

/* top: owl + bubble */
.stage{display:flex;align-items:flex-end;gap:10px;min-height:150px}
.owl{width:130px;flex:none;transform-origin:50% 90%}
.owl svg{width:100%;height:auto;display:block}
.bubble{flex:1;min-width:0;background:var(--ink);color:var(--sky);border-radius:22px 22px 22px 6px;padding:12px 16px;
  font-family:var(--display);font-weight:800;font-size:clamp(20px,5.2vw,30px);line-height:1.15;margin-bottom:40px;text-wrap:balance;position:relative}
.score{display:flex;gap:4px;font-size:22px;min-height:28px;justify-content:center}
.score .s{filter:grayscale(1) opacity(.35);transition:filter .3s,transform .3s}
.score .s.on{filter:none;transform:scale(1.15)}

/* camera window */
.view.seen{border-color:var(--leaf)}
.view{transition:border-color .15s;flex:1;min-height:0;position:relative;border-radius:28px;overflow:hidden;background:#0f0d2e;border:4px solid var(--sky-2)}
video{width:100%;height:100%;object-fit:cover;display:block}
video.mirror{transform:scaleX(-1)}
.frame{position:absolute;inset:8% 10%;border:4px dashed rgba(255,211,92,.85);border-radius:22px;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-weight:800;font-size:15px;color:var(--moon);text-shadow:0 2px 6px #000}
.flash{position:absolute;inset:0;display:grid;place-items:center;font-size:min(42vw,220px);pointer-events:none;opacity:0;transition:opacity .15s}
.flash.show{opacity:1;animation:pop .5s ease}
.flash.good{background:rgba(95,211,154,.35)} .flash.bad{background:rgba(255,107,138,.3)}

/* tap fallback grid */
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;padding:12px;overflow:auto;align-content:start;background:#0f0d2e}
.grid button{aspect-ratio:3/4;border-radius:16px;border:0;font-size:44px;background:var(--sky-2);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.grid button span{font-size:12px;font-weight:800;font-family:var(--body)}
.grid button:active{transform:scale(.95)}

/* controls */
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:0;border-radius:999px;padding:10px 14px;font:800 15px var(--body);background:var(--sky-2);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--moon);color:var(--sky)}
.chip:focus-visible,.big:focus-visible,.grid button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}

/* start screen */
.start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  background:radial-gradient(120% 80% at 50% 0%,var(--sky-2),var(--sky) 70%);padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.start h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,10vw,64px);margin:0;line-height:1;color:var(--moon)}
.start p{margin:0;color:var(--dim);font-size:17px;max-width:30ch}
.start .owl{width:170px}
.big{border:0;border-radius:999px;padding:18px 34px;font:800 26px var(--display);background:var(--leaf);color:var(--sky);cursor:pointer;box-shadow:0 6px 0 #2f9a67}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #2f9a67}
.modes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{font-size:13px;color:var(--dim);max-width:36ch}

/* owl moods */
.owl.happy{animation:hop .6s ease 2}
.owl.bad{animation:shake .5s ease}
.owl.think{animation:tilt 1.2s ease-in-out infinite}
.owl .wing{transform-box:fill-box;transform-origin:50% 10%}
.owl.happy .wing.l{animation:flapL .3s ease 4} .owl.happy .wing.r{animation:flapR .3s ease 4}
.owl .lid{transform-box:fill-box;transform-origin:50% 0;animation:blink 4.5s infinite}
@keyframes hop{50%{transform:translateY(-22px) scale(1.04)}}
@keyframes shake{20%,60%{transform:rotate(-8deg)}40%,80%{transform:rotate(8deg)}}
@keyframes tilt{50%{transform:rotate(-7deg)}}
@keyframes flapL{50%{transform:rotate(35deg)}} @keyframes flapR{50%{transform:rotate(-35deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.owl{width:100px}.stage{min-height:120px}.bubble{margin-bottom:24px}}
</style>
</head>
<body>
<div class="stars-bg"></div>

<template id="owlTpl">
<svg viewBox="0 0 200 210" aria-hidden="true">
  <path class="wing l" d="M38 110 C10 130 14 175 44 182 C40 160 44 132 56 116Z" fill="#8a5a3c"/>
  <path class="wing r" d="M162 110 C190 130 186 175 156 182 C160 160 156 132 144 116Z" fill="#8a5a3c"/>

  <ellipse cx="100" cy="148" rx="42" ry="48" fill="#f2d3a8"/>

  <circle cx="70" cy="88" r="30" fill="#fff8e6"/><circle cx="130" cy="88" r="30" fill="#fff8e6"/>
  <circle class="pupil" cx="72" cy="90" r="13" fill="#1d1a4a"/><circle class="pupil" cx="128" cy="90" r="13" fill="#1d1a4a"/>
  <circle cx="76" cy="85" r="4" fill="#fff"/><circle cx="132" cy="85" r="4" fill="#fff"/>
  <rect class="lid" x="38" y="56" width="64" height="64" rx="32" fill="#a86f48"/>
  <rect class="lid" x="98" y="56" width="64" height="64" rx="32" fill="#a86f48"/>
  <path d="M92 108 L108 108 L100 124Z" fill="#ffb03b"/>
  <path d="M74 200 l-6 8 M82 200 v9 M90 200 l6 8 M110 200 l-6 8 M118 200 v9 M126 200 l6 8" stroke="#ffb03b" stroke-width="5" stroke-linecap="round"/>
</svg>
</template>

<div class="start" id="start">
  <div class="owl" id="owlStart"></div>
  <h1>Gra z Sową</h1>
  <p>Sowa pyta, a Ty pokazujesz kartę do kamery.</p>
  <div class="modes" id="decks" role="group" aria-label="Talia"></div>
  <div class="modes" role="group" aria-label="Tryb gry">
    <button class="chip" id="mFind" aria-pressed="true">Pokaż mi…</button>
    <button class="chip" id="mFree" aria-pressed="false">Co to jest?</button>
    <button class="chip" id="mStory" aria-pressed="false">📖 Przygoda</button>
  </div>
  <div class="modes" role="group" aria-label="Język">
    <button class="chip" id="lPl" aria-pressed="true">Polski</button>
    <button class="chip" id="lEn" aria-pressed="false">English</button>
  </div>
  <button class="big" id="go">Zaczynamy!</button>
  <p class="note">Telefon postaw na stole, tak żeby przednia kamera widziała dziecko. Karty wydrukujesz z folderu „karty”.</p>
</div>

<div class="app" id="app" hidden>
  <div class="stage">
    <div class="owl" id="owl"></div>
    <div class="bubble" id="bubble">…</div>
  </div>
  <div class="score" id="score" aria-label="Gwiazdki"></div>
  <div class="view" id="view">
    <video id="video" playsinline muted autoplay class="mirror"></video>
    <div class="frame" id="frame"></div>
    <div class="hint" id="hint">Pokaż kartę sowie</div>
    <div class="grid" id="grid" hidden></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="bar">
    <button class="chip" id="again">🔁 Powtórz</button>
    <button class="chip" id="skip">⏭ Dalej</button>
    <button class="chip" id="flip">🔄 Kamera</button>
    <button class="chip" id="tap" aria-pressed="false">👆 Bez kamery</button>
    <button class="chip" id="home">🏠</button>
  </div>
</div>
<canvas id="cv" hidden></canvas>

<script type="module">import QrScanner from "./vendor/qr-scanner.min.js"; window.QrScanner=QrScanner; window.dispatchEvent(new Event("qrready"));</script>
<script src="decks.js"></script>
<script>
let deck=window.DECKS[0], V=deck.cards, STORY=deck.story, SILLY=deck.silly||{};
const byId=Object.fromEntries(window.DECKS.flatMap(d=>d.cards).map(c=>[c.id,c]));
const askFor=n=>(lang==="pl"?deck.askPl:deck.askEn).replace("{n}",n);
function setDeck(id){ deck=window.DECKS.find(d=>d.id===id)||window.DECKS[0]; V=deck.cards; STORY=deck.story; SILLY=deck.silly||{}; order=[]; target=null; renderGrid();
  $("mStory").hidden=!STORY; if(!STORY&&mode==="story") setMode("find");
  document.querySelectorAll("#decks .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===deck.id)); }
let step=0, misses=0;
const T = {
 pl:{ask:n=>askFor(n), yes:n=>`Brawo! To ${n}!`, no:(n,t)=>`To ${n}. `+askFor(t), free:"Pokaż mi dowolną kartę!", win:"Super! Pięć gwiazdek! Gramy dalej?", hint:"Pokaż kartę sowie", nocam:"Nie mam dostępu do kamery. Dotykaj obrazków!", hello:"Cześć! Jestem Sowa. Pobawimy się?"},
 en:{ask:n=>askFor(n), yes:n=>`Great job! That's the ${n}!`, no:(n,t)=>`That's the ${n}. `+askFor(t), free:"Show me any card!", win:"Amazing! Five stars! Let's play again!", hint:"Show a card to Owl", nocam:"No camera access. Tap the pictures!", hello:"Hi! I'm Owl. Let's play!"}
};
let lang="pl", mode="find", target=null, stars=0, busy=false, lastCode="", lastAt=0, facing="user", stream=null, tapMode=false, order=[];
const $=id=>document.getElementById(id);
const owlTpl=$("owlTpl").innerHTML; $("owl").innerHTML=owlTpl; $("owlStart").innerHTML=owlTpl;
const vname=v=>v[lang];

/* ---------- voice ---------- */
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices(); const want=lang==="pl"?"pl":"en";
  voice=vs.find(v=>v.lang.toLowerCase().startsWith(want)&&/female|zosia|ewa|paulina|samantha|google/i.test(v.name))||vs.find(v=>v.lang.toLowerCase().startsWith(want))||null;}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=pickVoice; pickVoice();}
function say(text){ $("bubble").textContent=text;
  return new Promise(res=>{ if(!("speechSynthesis" in window)||!text) return setTimeout(res,text?1200:0);
    const ss=speechSynthesis; if(ss.speaking||ss.pending) ss.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang=lang==="pl"?"pl-PL":"en-US";
    if(voice)u.voice=voice; u.rate=1; u.pitch=1.25; let done=false; const fin=()=>{if(!done){done=true;res();}};
    u.onend=fin; u.onerror=fin; setTimeout(fin, 1200+text.length*60);   // iOS sometimes never fires onend
    setTimeout(()=>{ ss.resume(); ss.speak(u); },60); });}               // short gap after cancel avoids a dropped utterance on iOS

/* ---------- sounds (synthesized, no files) ---------- */
let ac=null;
function actx(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state!=="running"){ try{ ac.resume(); }catch(e){} } return ac; }
/* iPhone mutes Web Audio when the ring/silent switch is on; ask for "playback" so game sounds play like a video does */
function unlockAudio(){ try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  try{ const a=new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA="); a.setAttribute("playsinline",""); a.play().catch(()=>{}); }catch(e){}
  const c=actx(); try{ const o=c.createOscillator(), g=c.createGain(); g.gain.value=0; o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+.05); }catch(e){} }
function tone(f,dur,type="sine",vol=.18,when=0,slideTo){const c=actx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;
  o.type=type;o.frequency.setValueAtTime(f,t); if(slideTo)o.frequency.linearRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol=.15,when=0,lp=1200){const c=actx(),b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter(),t=c.currentTime+when;
  f.type="lowpass";f.frequency.value=lp;s.buffer=b;g.gain.setValueAtTime(vol,t);g.gain.linearRampToValueAtTime(0,t+dur);s.connect(f).connect(g).connect(c.destination);s.start(t);}
function vox(o){ const c=actx(), t=c.currentTime+(o.when||0), d=o.dur, f=o.f;
  const osc=c.createOscillator(); osc.type=o.type||"sawtooth"; osc.frequency.setValueAtTime(f[0],t);
  if(f.length===2) osc.frequency.exponentialRampToValueAtTime(f[1],t+d);
  if(f.length===3){ osc.frequency.exponentialRampToValueAtTime(f[1],t+d*.4); osc.frequency.exponentialRampToValueAtTime(f[2],t+d); }
  if(o.vib){ const l=c.createOscillator(), lg=c.createGain(); l.frequency.value=o.vib[0]; lg.gain.value=o.vib[1]; l.connect(lg).connect(osc.frequency); l.start(t); l.stop(t+d+.05); }
  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(o.vol||.4,t+.03); g.gain.setValueAtTime(o.vol||.4,t+d*.7); g.gain.linearRampToValueAtTime(0,t+d);
  (o.fm||[800]).forEach(fr=>{ const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=fr; bp.Q.value=o.q||4; osc.connect(bp).connect(g); });
  g.connect(c.destination); osc.start(t); osc.stop(t+d+.05); }
const SND={
 siren:()=>{for(let i=0;i<4;i++)tone(i%2?660:880,.35,"triangle",.14,i*.36);},
 police:()=>{for(let i=0;i<3;i++)tone(600,.45,"sawtooth",.07,i*.45,1100);},
 horn:()=>{tone(392,.18,"square",.08);tone(392,.3,"square",.08,.25);},
 engine:()=>{for(let i=0;i<8;i++)tone(70,.12,"sawtooth",.12,i*.13);},
 whistle:()=>{tone(1046,.5,"sine",.12);tone(1318,.5,"sine",.08);tone(1046,.6,"sine",.12,.6);},
 whoosh:()=>noise(1.1,.25,0,900),
 chopper:()=>{for(let i=0;i<10;i++)noise(.06,.3,i*.1,500);},
 ship:()=>{tone(110,1.1,"sawtooth",.1);tone(165,1.1,"sine",.08);},
/* animals: a source tone shaped by a vocal-tract-like filter, with optional vibrato */
 dog:()=>{vox({f:[320,170],dur:.16,type:"square",fm:[600,1400],vol:.5});vox({f:[300,160],dur:.18,type:"square",fm:[600,1400],vol:.5,when:.32});noise(.08,.25,0,1800);noise(.08,.25,.32,1800);},
 cat:()=>vox({f:[480,820,420],dur:.8,fm:[950,2300],vol:.45,vib:[6,10]}),
 cow:()=>vox({f:[105,130,90],dur:1.4,fm:[300,750],vol:.7,vib:[4,4]}),
 pig:()=>{vox({f:[190,140],dur:.22,fm:[450,1100],vol:.5,vib:[35,25]});vox({f:[200,150],dur:.25,fm:[450,1100],vol:.5,vib:[35,25],when:.3});},
 horse:()=>vox({f:[650,1150,450],dur:1.2,fm:[850,2100],vol:.4,vib:[13,70]}),
 hen:()=>{[0,.14,.28,.42].forEach(t=>vox({f:[620,430],dur:.09,type:"square",fm:[900,2000],vol:.35,when:t}));vox({f:[700,950,500],dur:.35,type:"square",fm:[900,2000],vol:.35,when:.6});},
 sheep:()=>vox({f:[360,330],dur:1,fm:[700,1600],vol:.5,vib:[9,30]}),
 duck:()=>{vox({f:[400,300],dur:.25,type:"square",fm:[1100,2600],q:8,vol:.45});vox({f:[400,300],dur:.25,type:"square",fm:[1100,2600],q:8,vol:.45,when:.35});},
 lion:()=>{noise(1.5,.5,0,380);vox({f:[95,70],dur:1.4,fm:[250,600],vol:.6,vib:[22,12]});},
 elephant:()=>vox({f:[420,760,520],dur:1.1,type:"square",fm:[1300,2700],vol:.35,vib:[7,18]}),
 munch:()=>{for(let i=0;i<5;i++)noise(.07,.35,i*.18,2500);},
 monkey:()=>{[0,.18,.36,.54].forEach((t,i)=>vox({f:[380+i*90,560+i*120],dur:.15,fm:[800,1700],vol:.4,when:t}));},
 good:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.18,"triangle",.15,i*.09));},
 bad:()=>tone(220,.3,"square",.06,0,160)
};

/* ---------- owl moods ---------- */
function mood(m){const o=$("owl");o.classList.remove("happy","bad","think");void o.offsetWidth;if(m)o.classList.add(m);}
function flash(content,kind){const f=$("flash");f.textContent=content;f.className="flash show "+kind;setTimeout(()=>f.className="flash",1200);}
function drawScore(){const n=mode==="story"?STORY.steps.length:5, k=mode==="story"?step:stars, ic=mode==="story"?"🚩":"⭐";
  $("score").innerHTML=Array.from({length:n},(_,i)=>`<span class="s${i<k?" on":""}">${ic}</span>`).join("");}

/* ---------- game flow ---------- */
function nextTarget(){ if(!order.length) order=[...V].sort(()=>Math.random()-.5);
  let n=order.pop(); if(target&&n.id===target.id&&order.length) n=order.pop(); return n;}
async function ask(){ mood("think"); let q;
  if(mode==="story"){ target=byId[[].concat(STORY.steps[step].ans)[0]]; misses=0; q=STORY.steps[step].ask; }
  else if(mode==="find"){ target=nextTarget(); q=T[lang].ask(vname(target)); }
  else { target=null; q=T[lang].free; }
  busy=false; await say(q); mood(null); }

async function onCard(id){
  const v=byId[id]; if(!v||busy) return; busy=true; try{ speechSynthesis.cancel(); }catch(e){}
  if(mode==="story"){ const st=STORY.steps[step];
    if([].concat(st.ans).includes(v.id)){ flash(v.e,"good"); mood("happy"); SND.good(); step++; drawScore(); SND[v.snd]?.(); await say(st.after); await wait(600);
      if(step>=STORY.steps.length){ mood("happy"); SND.good(); await say(STORY.end); step=0; drawScore(); mood(null); busy=false; return; }
      ask();
    } else { flash(v.e,"bad"); mood("bad"); SND.bad(); misses++;
      await say((SILLY[v.id]||SILLY.default||"Hmm, nie tym razem!")+" "+(misses>=2?"Podpowiem: "+st.hint:"Spróbuj jeszcze raz!")); mood(null); busy=false; }
    return; }
  if(mode==="free"){ flash(v.e,"good"); mood("happy"); SND[v.snd]?.(); await wait(900);
    await say(vname(v)[0].toUpperCase()+vname(v).slice(1)+"! "+(lang==="pl"?v.fpl:(v.fen||v.fpl))); busy=false; mood(null); return; }
  if(v.id===target.id){ flash(v.e,"good"); mood("happy"); SND.good(); stars++; drawScore();
    await say(T[lang].yes(vname(v))); SND[v.snd]?.(); await wait(1300);
    if(stars>=5){ await say(T[lang].win); stars=0; drawScore(); await wait(400); }
    ask();
  } else { flash(v.e,"bad"); mood("bad"); SND.bad(); await say(T[lang].no(vname(v),vname(target))); mood(null); busy=false; }
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- camera + QR ---------- */
const video=$("video");
let engine=null, loopId=0;
async function getEngine(){ if(engine) return engine;
  if(!window.QrScanner) await new Promise(r=>{ window.addEventListener("qrready",r,{once:true}); setTimeout(r,4000); });
  if(!window.QrScanner) return null;
  try{ engine=await QrScanner.createQrEngine(); }catch(e){ engine=null; } return engine; }
async function startCam(){ stopCam();
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
    try{ await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:"continuous"}]}); }catch(e){}
    video.srcObject=stream; await video.play(); video.classList.toggle("mirror",facing==="user");
    await getEngine(); scanLoop(++loopId); return true;
  }catch(e){ return false; } }
function stopCam(){ loopId++; if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;} }
/* regions: whole frame, then a ~1.7x zoom on the centre. No separate bottom pass: it picked up cards lying on the table or floor */
function region(pass){ const vw=video.videoWidth, vh=video.videoHeight;
  const r = pass===0 ? {x:0,y:0,width:vw,height:vh} : {x:vw*.2,y:vh*.2,width:vw*.6,height:vh*.6};
  const ds=Math.min(720,Math.round(r.width)); return {...r, downScaledWidth:ds, downScaledHeight:Math.round(ds*r.height/r.width)}; }
const cv=$("cv");
const MIN_CODE=0.06;   // code must span at least 6% of the frame width: a card held up, not one lying far away
async function scanLoop(id){ let pass=0;
  while(id===loopId && stream){
    if(!tapMode && video.readyState>=2 && video.videoWidth && engine){
      try{ const r=await QrScanner.scanImage(video,{qrEngine:engine,canvas:cv,scanRegion:region(pass),returnDetailedScanResult:true});
           if(r && r.data) gotCode(r); }catch(e){ /* no code in this frame */ }
      pass=(pass+1)%2;
    }
    await wait(25);
  } }
function gotCode(r){ const cid=r.data.replace(/^(SOWA1|S1):/i,"").trim().toLowerCase(); if(!byId[cid]) return;
  const xs=(r.cornerPoints||[]).map(p=>p.x); const w=xs.length? Math.max(...xs)-Math.min(...xs) : video.videoWidth;
  if(w < video.videoWidth*MIN_CODE) return;                       // too small = lying somewhere in the background
  const now=performance.now();
  $("view").classList.add("seen"); setTimeout(()=>$("view").classList.remove("seen"),250);
  if(cid===lastCode && now-lastAt<1500) return; lastCode=cid; lastAt=now; onCard(cid); }

/* ---------- tap fallback ---------- */
function renderGrid(){ $("grid").innerHTML=V.map(v=>`<button data-id="${v.id}" aria-label="${v.pl}">${v.e}<span>${v[lang]}</span></button>`).join(""); }
$("grid").addEventListener("click",e=>{const b=e.target.closest("button");if(b)onCard(b.dataset.id);});
function setTap(on){ tapMode=on; $("tap").setAttribute("aria-pressed",on); $("grid").hidden=!on; $("frame").hidden=on; $("hint").hidden=on;
  $("grid").querySelectorAll("span").forEach((s,i)=>s.textContent=V[i][lang]); }

/* ---------- UI wiring ---------- */
function toggle(a,b,on){$(a).setAttribute("aria-pressed",on);$(b).setAttribute("aria-pressed",!on);}
function setMode(m){mode=m;["mFind","mFree","mStory"].forEach(id=>$(id).setAttribute("aria-pressed",id==={find:"mFind",free:"mFree",story:"mStory"}[m]));}
$("mFind").onclick=()=>setMode("find"); $("mFree").onclick=()=>setMode("free"); $("mStory").onclick=()=>setMode("story");
$("lPl").onclick=()=>{lang="pl";toggle("lPl","lEn",true);pickVoice()}; $("lEn").onclick=()=>{lang="en";toggle("lPl","lEn",false);pickVoice()};
$("go").onclick=async()=>{ if(mode==="story"&&lang!=="pl"){ lang="pl"; toggle("lPl","lEn",true); pickVoice(); } unlockAudio(); say(""); $("start").hidden=true; $("app").hidden=false; stars=0; step=0; drawScore();
  $("hint").textContent=T[lang].hint; busy=true;
  const ok=navigator.mediaDevices?.getUserMedia ? await startCam() : false;
  if(!ok){ setTap(true); await say(T[lang].nocam); } else setTap(false);
  mood("happy"); await say(mode==="story"?STORY.intro:T[lang].hello); ask(); };
$("again").onclick=()=>{ if(busy) return; busy=true; ask_repeat(); };
async function ask_repeat(){ if(mode==="story") await say(STORY.steps[step].ask); else if(mode==="find"&&target) await say(T[lang].ask(vname(target))); else await say(T[lang].free); busy=false; }
$("skip").onclick=()=>{ if(busy) return; busy=true; if(mode==="story"){ step=(step+1)%STORY.steps.length; drawScore(); } ask(); };
$("flip").onclick=async()=>{ facing=facing==="user"?"environment":"user"; if(!tapMode) await startCam(); };
$("tap").onclick=()=>setTap(!tapMode);
$("home").onclick=()=>{ stopCam(); speechSynthesis?.cancel(); $("app").hidden=true; $("start").hidden=false; };
document.addEventListener("visibilitychange",()=>{ if(document.hidden) stopCam(); else if(!$("app").hidden && !tapMode) startCam(); });
try{ navigator.wakeLock?.request("screen").catch(()=>{}); }catch(e){}
$("decks").innerHTML=window.DECKS.map(d=>`<button class="chip" data-id="${d.id}" aria-pressed="false">${d.cards[0].e} ${d.pl}</button>`).join("");
$("decks").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) setDeck(b.dataset.id);});
setDeck(window.DECKS[0].id);
</script>
